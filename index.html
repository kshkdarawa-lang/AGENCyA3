<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGENC A3 — صوتك يجمعنا</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b11;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:15px}
.card{background:#211722;border:1px solid #4a304d;border-radius:20px;padding:15px;margin:10px 0}.row{display:flex;gap:6px;flex-wrap:wrap}
input,button,select{border:0;border-radius:12px;padding:12px;font-size:15px}input,select{background:#342437;color:#fff}input{flex:1;min-width:150px}button{background:#ad8037;color:#fff;font-weight:bold}.dark{background:#463348}.red{background:#873443}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.seat,.user{background:#302033;border-radius:14px;padding:10px}.seat{text-align:center;min-height:90px}.user{display:flex;justify-content:space-between;align-items:center;margin:6px 0}.small{color:#cbbccc;font-size:13px}.hidden{display:none}.msg{background:#342437;border-radius:12px;padding:8px;margin:5px}.me{background:#624b29}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#e1a84d;color:#181019;padding:10px 16px;border-radius:13px;display:none}
</style>
<style>
.music-card{margin-top:16px}
.music-player{display:grid;gap:10px}
.music-now{font-weight:700;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.music-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px}
.music-item{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:rgba(255,255,255,.04);cursor:pointer;color:inherit;text-align:right}
.music-item:hover{background:rgba(255,255,255,.08)}
.music-item.active{outline:2px solid rgba(255,255,255,.35)}
.pill{font-size:12px;opacity:.8}
.hint{opacity:.7;font-size:13px}
</style>
</head><body><div class="wrap"><div class="card"><h1>🎙️ AGENC A3</h1><div class="small">صوتك يجمعنا</div></div>
<div id="auth" class="card"><h3>🔐 الدخول</h3><div class="row"><input id="username" placeholder="اسم المستخدم"><input id="password" type="password" placeholder="كلمة المرور (6 أحرف+)"></div><button onclick="register()">إنشاء حساب</button><button class="dark" onclick="login()">دخول</button></div>
<div id="app" class="hidden">
<div class="card"><b>👤 <span id="who"></span></b> — 🪙 <span id="coins">0</span> <button class="red" onclick="logout()">خروج</button></div>
<div class="card"><div class="row"><input id="room" value="room-1"><button onclick="join()">دخول الغرفة</button><button id="mic" class="dark" disabled onclick="mic()">🎤 الميك</button><button id="hand" class="dark" disabled onclick="hand()">✋ رفع اليد</button></div><div id="status" class="small">جاهز</div></div>
<div class="card"><b>💺 المقاعد</b><div id="seats" class="grid"></div></div>
<div class="card"><b>👥 الأعضاء</b><div id="users"></div></div>
<div class="card"><b>🎁 هدية</b><div class="row"><select id="gift"><option value="🌹|10">🌹 10</option><option value="💎|100">💎 100</option><option value="👑|500">👑 500</option><option value="🚀|1000">🚀 1000</option></select><input id="receiver" placeholder="معرف المستقبل"><button onclick="sendGift()">إرسال</button></div></div>
<div class="card"><b>👫 الأصدقاء</b><div class="row"><input id="friend" placeholder="معرف المستخدم"><button onclick="addFriend()">إضافة</button></div><div id="friends"></div></div>
<div class="card"><b>💬 الرسائل الخاصة</b><div class="row"><input id="chatId" placeholder="معرف المستخدم"><input id="body" placeholder="الرسالة"><button onclick="sendMessage()">إرسال</button></div><div id="messages"></div></div>
<div class="card"><b>🎮 لعبة سريعة</b><div class="row"><button onclick="game()">🎲 ارمي النرد</button><span id="gameResult" class="small"></span></div></div>
</div></div><div id="toast" class="toast"></div>
<script>
let token=localStorage.a3token||"",uid="",ws=null,stream=null,users=[],pcs=new Map();
const $=id=>document.getElementById(id),toast=t=>{$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1600)};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||"خطأ");return d}
function save(d){token=d.token;uid=d.user.id;localStorage.a3token=token;$("who").textContent=d.user.username;$("coins").textContent=d.user.coins;$("auth").classList.add("hidden");$("app").classList.remove("hidden");friends()}
async function register(){try{save(await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})}).then(r=>r.json()).then(d=>{if(d.error)throw Error(d.error);return d}))}catch(e){toast(e.message)}}
async function login(){try{save(await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})}).then(r=>r.json()).then(d=>{if(d.error)throw Error(d.error);return d}))}catch(e){toast(e.message)}}
async function me(){try{const d=await api("/api/me");save({user:d.user,token})}catch{}}
function logout(){localStorage.clear();location.reload()}
async function friends(){try{let f=await api("/api/friends");$("friends").innerHTML=f.map(x=>`${x.username} <small>${x.id}</small>`).join("<br>")}catch{}}
async function addFriend(){try{await api("/api/friends/"+$("friend").value,{method:"POST"});toast("تمت الإضافة");friends()}catch(e){toast(e.message)}}
async function sendMessage(){try{await api("/api/messages/"+$("chatId").value,{method:"POST",body:JSON.stringify({body:$("body").value})});$("body").value="";loadMessages()}catch(e){toast(e.message)}}
async function loadMessages(){try{let m=await api("/api/messages/"+$("chatId").value);$("messages").innerHTML=m.map(x=>`<div class="msg ${x.sender_id===uid?"me":""}">${esc(x.body)}</div>`).join("")}catch{}}
async function sendGift(){try{let [gift,cost]=$("gift").value.split("|");await api("/api/gifts",{method:"POST",body:JSON.stringify({receiver_id:$("receiver").value,gift,cost:+cost})});let d=await api("/api/me");$("coins").textContent=d.user.coins;toast("تم إرسال الهدية")}catch(e){toast(e.message)}}
async function game(){let n=Math.floor(Math.random()*6)+1,r= n===6?100:n===5?50:10;try{let d=await api("/api/games/reward",{method:"POST",body:JSON.stringify({reward:r})});$("coins").textContent=d.coins;$("gameResult").textContent=`🎲 ${n} — +${r} عملة`}catch(e){toast(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function wurl(){return(location.protocol==="https:"?"wss://":"ws://")+location.host}
function join(){if(ws)return;ws=new WebSocket(wurl());ws.onopen=()=>ws.send(JSON.stringify({type:"join",roomId:$("room").value,token}));ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==="state"){users=m.room;render();$("mic").disabled=false;$("hand").disabled=false;$("status").textContent="متصل"}if(m.type==="error")toast(m.message);if(m.type==="removed"){toast("تم إخراجك");ws.close()}if(m.type==="offer"){let p=await peer(m.from,false);await p.setRemoteDescription(m.sdp);let a=await p.createAnswer();await p.setLocalDescription(a);ws.send(JSON.stringify({type:"answer",to:m.from,sdp:p.localDescription}))}if(m.type==="answer"){let p=pcs.get(m.from);if(p)await p.setRemoteDescription(m.sdp)}if(m.type==="ice"){let p=pcs.get(m.from);if(p&&m.candidate)try{await p.addIceCandidate(m.candidate)}catch{}}};ws.onclose=()=>{$("status").textContent="انقطع الاتصال";ws=null}}
function render(){let self=users.find(x=>x.id===uid);$("seats").innerHTML="";for(let i=0;i<8;i++){let u=users.find(x=>x.seat===i),d=document.createElement("div");d.className="seat";d.innerHTML=u?`🎙️<br>${esc(u.name)}<br>${u.muted?"🔇":"🔊"}`:`💺<br>مقعد ${i+1}`;d.onclick=()=>ws.send(JSON.stringify({type:"seat",seat:u?null:i}));$("seats").appendChild(d)}$("users").innerHTML=users.map(u=>`<div class=user><span>${u.host?"👑 ":""}${esc(u.name)}<br><small>${u.seat===null?"مستمع":"مقعد "+(u.seat+1)} ${u.hand?"✋":""}</small></span>${self?.host&&u.id!==uid?`<button onclick="mod('${u.id}','mute')">🔇</button><button onclick="mod('${u.id}','remove')">🚫</button>`:""}</div>`).join("")}
function mod(id,action){ws.send(JSON.stringify({type:"moderate",target:id,action}))}
async function mic(){if(!stream)stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});let t=stream.getAudioTracks()[0];t.enabled=!t.enabled;$("mic").textContent=t.enabled?"🔇 إيقاف":"🎤 تشغيل";ws.send(JSON.stringify({type:"mute",value:!t.enabled}));for(let u of users)if(u.id!==uid)await peer(u.id,true)}
function hand(){let u=users.find(x=>x.id===uid);ws.send(JSON.stringify({type:"hand",value:!u?.hand}))}
async function peer(id,init){if(pcs.has(id))return pcs.get(id);let p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pcs.set(id,p);stream?.getTracks().forEach(t=>p.addTrack(t,stream));p.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:"ice",to:id,candidate:e.candidate}));p.ontrack=e=>{let a=document.getElementById("a"+id);if(!a){a=document.createElement("audio");a.id="a"+id;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0]};if(init){let o=await p.createOffer();await p.setLocalDescription(o);ws.send(JSON.stringify({type:"offer",to:id,sdp:p.localDescription}))}return p}
if(token)me();
</script>
      <section class="card music-card">
        <div class="section-title">
          <h2>🎵 الموسيقى</h2>
          <span class="pill">تجريبية</span>
        </div>
        <div class="music-player">
          <div class="music-now" id="musicNow">اختر أغنية للتشغيل</div>
          <audio id="musicAudio" controls preload="none"></audio>
        </div>
        <div class="music-list" id="musicList"></div>
        <p class="hint">يمكنك تشغيل موسيقى تجريبية من القائمة أثناء وجودك في الغرفة. ملفات الموسيقى المحلية يمكن استبدالها لاحقًا بأغانيك المرخّصة.</p>
      </section>

<script>
(() => {
  const songs = [
    {title:"موسيقى هادئة", src:"https://cdn.pixabay.com/audio/2022/10/25/audio_9465e0b2f8.mp3"},
    {title:"موسيقى لاونج", src:"https://cdn.pixabay.com/audio/2022/03/15/audio_0f1d4b0d64.mp3"},
    {title:"موسيقى رومانسية", src:"https://cdn.pixabay.com/audio/2022/08/23/audio_2a6f5f0c1f.mp3"}
  ];
  const list=document.getElementById("musicList");
  const audio=document.getElementById("musicAudio");
  const now=document.getElementById("musicNow");
  if(!list || !audio || !now) return;
  songs.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="music-item";
    b.type="button";
    b.textContent="🎵 "+s.title;
    b.onclick=()=>{
      audio.src=s.src;
      now.textContent="يعمل الآن: "+s.title;
      [...list.children].forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      audio.play().catch(()=>{});
    };
    list.appendChild(b);
  });
})();
</script>
</body></html>
